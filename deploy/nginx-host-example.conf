# ==============================================================================
# CẤU HÌNH NGINX MẪU CHO MÁY CHỦ TRƯỜNG ĐÃ CÓ SẴN NGINX (REVERSE PROXY VÀO APP)
# ==============================================================================
# Sử dụng tệp cấu hình này khi máy chủ Ubuntu của trường/giảng viên đã chạy sẵn
# Nginx và đang phục vụ các website khác trên cổng 80/443.
#
# Cách sử dụng:
# 1. Sao chép tệp này vào thư mục Nginx của máy chủ:
#    sudo cp deploy/nginx-host-example.conf /etc/nginx/sites-available/ovarian-survey.conf
#
# 2. Thay thế các placeholder:
#    - YOUR_DOMAIN: Tên miền thực tế (ví dụ: gpb.example.edu.vn)
#    - YOUR_APP_PORT: Cổng ứng dụng đã đặt trong .env (mặc định: 8080)
#    - Đường dẫn chứng chỉ SSL của trường hoặc Let's Encrypt
#
# 3. Kích hoạt và kiểm tra Nginx:
#    sudo ln -s /etc/nginx/sites-available/ovarian-survey.conf /etc/nginx/sites-enabled/
#    sudo nginx -t
#    sudo systemctl reload nginx
# ==============================================================================

# Chuyển hướng HTTP sang HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN; # Ví dụ: gpb.example.edu.vn

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Cấu hình HTTPS an toàn
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN; # Ví dụ: gpb.example.edu.vn

    # Đường dẫn chứng chỉ SSL
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # SSL protocols và ciphers khuyến nghị
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    # Giới hạn kích thước tải lên
    client_max_body_size 10M;

    # Chuyển tiếp toàn bộ request về stack Docker đang chạy ở cổng 8080 (hoặc cổng cấu hình)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
}
