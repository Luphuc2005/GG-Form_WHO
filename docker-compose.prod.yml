# Production overrides for docker-compose.yml
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  nginx:
    ports:
      # In standalone production mode, bind directly to port 80 (and 443 if SSL handled by container)
      # Or keep default APP_HTTP_PORT=80
      - "${APP_HTTP_PORT:-80}:80"
