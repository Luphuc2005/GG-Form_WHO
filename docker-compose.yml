services:
  postgres:
    image: postgres:16-alpine
    container_name: ovarian_survey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ovarian_survey}
      POSTGRES_USER: ${POSTGRES_USER:-survey_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-survey_user} -d ${POSTGRES_DB:-ovarian_survey}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - survey_internal

  backend:
    image: ovarian-survey-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ovarian_survey_backend
    restart: unless-stopped
    environment: &backend_environment
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-survey_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ovarian_survey}}"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      RUN_BACKGROUND_WORKERS: "false"
      SHEETS_SYNC_BATCH_SIZE: ${SHEETS_SYNC_BATCH_SIZE:-100}
      EXPORT_DIR: /app/data/exports
      EXPORT_TTL_HOURS: ${EXPORT_TTL_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      GOOGLE_SHEETS_WEBHOOK_URL: ${GOOGLE_SHEETS_WEBHOOK_URL:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_WEBHOOK_TOKEN: ${GOOGLE_SHEETS_WEBHOOK_TOKEN:-}
    volumes:
      - export_data:/app/data/exports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - survey_internal

  worker:
    image: ovarian-survey-backend:local
    container_name: ovarian_survey_worker
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.commands.run_worker"]
    environment:
      <<: *backend_environment
      DB_POOL_SIZE: 3
      DB_MAX_OVERFLOW: 2
      WORKER_HEARTBEAT_PATH: /tmp/who-worker-heartbeat
    volumes:
      - export_data:/app/data/exports
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.commands.run_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - survey_internal

  backup:
    image: postgres:16-alpine
    container_name: ovarian_survey_backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup_loop.sh"]
    environment:
      PGHOST: ${BACKUP_PGHOST:-postgres}
      PGPORT: ${BACKUP_PGPORT:-5432}
      PGDATABASE: ${BACKUP_PGDATABASE:-${POSTGRES_DB:-ovarian_survey}}
      PGUSER: ${BACKUP_PGUSER:-${POSTGRES_USER:-survey_user}}
      PGPASSWORD: ${BACKUP_PGPASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      APPLICATION_DATABASE_URL: ${DATABASE_URL:-}
      BACKUP_PGHOST: ${BACKUP_PGHOST:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - backup_data:/backups
      - ./scripts/backup_loop.sh:/scripts/backup_loop.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "/scripts/backup_loop.sh", "--healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - survey_internal

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: ovarian_survey_nginx
    restart: unless-stopped
    ports:
      - "${APP_HTTP_BIND:-0.0.0.0}:${APP_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - survey_internal

volumes:
  postgres_data:
    name: ovarian_survey_postgres_data
  export_data:
    name: ovarian_survey_export_data
  backup_data:
    name: ovarian_survey_backup_data

networks:
  survey_internal:
    name: ovarian_survey_network
    driver: bridge
